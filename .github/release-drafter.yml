# Configuration for release-drafter (see .github/workflows/release-drafter.yml).
#
# The published release notes come from release.yml; this file only shapes the
# *draft* that accumulates while PRs land on main.
#
# The `categories[*]` / `version-resolver` label fields this file used to rely on
# are deprecated in release-drafter v7 and warn loudly on every run, so both are
# expressed the current way: a category's `when` condition for the changelog, and
# dedicated `type: version-resolver` categories for the semver bump.

name-template: 'RAW UI $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

categories:
  # `type: version-resolver` categories only select the semver bump; they print
  # nothing themselves.  The first match wins, so the biggest bump is listed
  # first and the fallback (patch) is implicit when nothing matches.
  - type: 'version-resolver'
    title: 'Major bump'
    semver-increment: 'major'
    when:
      labels: ['major']
  - type: 'version-resolver'
    title: 'Minor bump'
    semver-increment: 'minor'
    when:
      labels: ['minor', 'feature', 'enhancement', 'performance']
  - type: 'version-resolver'
    title: 'Patch bump'
    semver-increment: 'patch'
    when:
      labels: ['patch', 'fix', 'bugfix', 'bug', 'chore', 'ci', 'build',
               'documentation', 'docs', 'dependencies']

  - title: '✨ Features'
    when:
      labels: ['feature', 'enhancement']
  - title: '🐛 Fixes'
    when:
      labels: ['fix', 'bugfix', 'bug']
  - title: '⚡ Performance'
    when:
      labels: ['performance']
  - title: '📝 Documentation'
    when:
      labels: ['documentation', 'docs']
  - title: '🔧 Maintenance'
    when:
      labels: ['chore', 'ci', 'build', 'dependencies']

exclude-title:
  - 'WIP'
  - 'wip'

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\([^)]*\))?: /'
  - label: 'fix'
    title:
      - '/^fix(\([^)]*\))?: /'
  - label: 'performance'
    title:
      - '/^perf(\([^)]*\))?: /'
  - label: 'documentation'
    title:
      - '/^docs(\([^)]*\))?: /'
    files:
      - 'docs/**'
      - '*.md'
  - label: 'chore'
    title:
      - '/^chore(\([^)]*\))?: /'
  - label: 'ci'
    files:
      - '.github/**'
  - label: 'build'
    files:
      - 'Makefile'
      - 'tools/**'
