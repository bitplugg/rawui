# Configuration for release-drafter (see .github/workflows/release-drafter.yml).
#
# The published release notes come from release.yml; this file only shapes the
# *draft* that accumulates while PRs land on main.

name-template: 'RAW UI $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

categories:
  - title: '✨ Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Fixes'
    labels: ['fix', 'bugfix', 'bug']
  - title: '⚡ Performance'
    labels: ['performance']
  - title: '📝 Documentation'
    labels: ['documentation', 'docs']
  - title: '🔧 Maintenance'
    labels: ['chore', 'ci', 'build', 'dependencies']

version-resolver:
  major:
    labels: ['major']
  minor:
    labels: ['minor', 'feature', 'enhancement', 'performance']
  patch:
    labels: ['patch', 'fix', 'bugfix', 'bug', 'chore', 'ci', 'build',
             'documentation', 'docs', 'dependencies']
  default: patch

exclude-labels:
  - 'skip-changelog'
exclude-title:
  - 'WIP'
  - 'wip'

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\([^)]*\))?: /'
  - label: 'fix'
    title:
      - '/^fix(\([^)]*\))?: /'
  - label: 'performance'
    title:
      - '/^perf(\([^)]*\))?: /'
  - label: 'documentation'
    title:
      - '/^docs(\([^)]*\))?: /'
    files:
      - 'docs/**'
      - '*.md'
  - label: 'chore'
    title:
      - '/^chore(\([^)]*\))?: /'
  - label: 'ci'
    files:
      - '.github/**'
  - label: 'build'
    files:
      - 'Makefile'
      - 'tools/**'
