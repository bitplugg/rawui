name: release

# Release triggers:
#   * push a tag like v1.2.3       → release v1.2.3
#   * manual run (workflow_dispatch):
#       - version field empty   → auto-increment patch of the latest tag
#                                 (0.0.1→0.0.2, 0.1.0→0.1.1; at .9 rolls over:
#                                  0.1.9→0.2.0, 1.0.9→1.1.0)
#       - version field filled  → that version is used (v prefix optional)
#   * tags with a prerelease suffix (v1.2.3-rc1, v1.2.3-beta.2) are published
#     as GitHub preleases and are skipped by the auto-increment logic.
# The job builds the FPKG with the version baked into param.sfo, generates a
# grouped changelog from commits since the previous stable release, attests
# the build provenance, and publishes a GitHub Release with the .pkg + SHA256
# checksum. The .pkg is also synced to docs/ for the Pages fallback.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3 or 1.2.3-rc1). Leave empty to auto-increment the patch of the latest stable tag.'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  meta:
    name: Derive version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}   # MAJOR.MINOR for param.sfo
      tag: ${{ steps.ver.outputs.tag }}           # vX.Y.Z for the release
      title: ${{ steps.ver.outputs.title }}       # X.Y.Z for the release title
      prerelease: ${{ steps.ver.outputs.prerelease }}  # true for vX.Y.Z-suffix tags
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # version comes from the tag itself
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "$IN_VERSION" ]; then
            TAG="v${IN_VERSION#v}"
          else
            # latest existing *stable* vN.N.N tag (version-sort), empty if none
            # yet; prerelease tags (v1.2.3-rc1) are ignored on purpose
            LAST="$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
                      --jq '.[].name' \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
            if [ -z "$LAST" ]; then
              TAG="v0.0.1"
            else
              M="${LAST#v}"
              MAJ="${M%%.*}"; REST="${M#*.}"
              MIN="${REST%%.*}"; PAT="${REST#*.}"
              PAT=$((PAT + 1))
              if [ "$PAT" -gt 9 ]; then PAT=0; MIN=$((MIN + 1)); fi
              TAG="v${MAJ}.${MIN}.${PAT}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=${TAG#v}" >> "$GITHUB_OUTPUT"
          # anything that is not a plain vX.Y.Z is a prerelease
          if printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          # PS4 param.sfo VERSION is MAJOR.MINOR (NN.NN format)
          # strip any prerelease suffix so v1.2.3-rc1 becomes 1.2
          MAJ="$(printf '%s' "${TAG#v}" | cut -d. -f1 | grep -oE '^[0-9]+' || true)"
          MIN="$(printf '%s' "${TAG#v}" | cut -d. -f2 | grep -oE '^[0-9]+' || true)"
          printf "version=%02d.%02d\n" "${MAJ:-1}" "${MIN:-0}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: $TAG"

  build:
    name: Build FPKG
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  release:
    name: Publish release
    needs: [meta, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0             # full history so the changelog covers old commits
          persist-credentials: true  # needed later to push the docs/ pkg sync

      - name: Download .pkg
        uses: actions/download-artifact@v4
        with:
          name: RAWUI0001-pkg
          path: dist

      - name: Checksum
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          cd dist
          # rename to the asset name the release will carry, then checksum it
          cp IV0000-*.pkg "RAWUI0001-${TAG}.pkg"
          sha256sum "RAWUI0001-${TAG}.pkg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          # ---- previous release tag (prereleases excluded) -------------------
          PREV="$(git tag --list --sort=-v:refname 'v*' \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | grep -vx "$TAG" \
                    | head -n1 || true)"
          RANGE="${PREV:+${PREV}..}HEAD"

          # ---- grouped changelog from conventional-commit subjects -----------
          # Type is matched case-insensitively before the first ':', an
          # optional scope is moved to the end in parentheses:
          #   "feat(themes): add presets"  ->  "- add presets (themes)"
          GROUPED="$(git log --no-merges --pretty=%s "$RANGE" | awk '
            {
              type = ""; scope = ""; desc = $0
              if (match($0, /^[ \t]*[A-Za-z][A-Za-z-]*(\([^)]*\))?[ \t]*:/)) {
                head = substr($0, 1, RLENGTH)
                desc = substr($0, RLENGTH + 1)
                sub(/^[ \t]+/, "", desc)
                sub(/:$/, "", head)
                sub(/[ \t]+$/, "", head)
                if (match(head, /\(/)) {
                  scope = substr(head, RSTART + 1)
                  sub(/\)[ \t]*$/, "", scope)
                  type = substr(head, 1, RSTART - 1)
                } else {
                  type = head
                }
                type = tolower(type)
              }
              line = "- " desc
              if (scope != "") line = line " (" scope ")"
              if      (type == "feat" || type == "feature")      g = 1
              else if (type == "fix" || type == "bugfix" || type == "fixes") g = 2
              else if (type == "perf" || type == "performance")  g = 3
              else if (type == "refactor")                       g = 4
              else if (type == "docs" || type == "doc")          g = 5
              else if (type == "test" || type == "tests")        g = 6
              else if (type == "chore" || type == "build" || type == "ci" ||
                       type == "style" || type == "update" ||
                       type == "dependencies")                   g = 7
              else                                               g = 8
              buf[g] = buf[g] line "\n"
            }
            END {
              title[1] = "### ✨ Features"
              title[2] = "### 🐛 Fixes"
              title[3] = "### ⚡ Performance"
              title[4] = "### 🔄 Refactor"
              title[5] = "### 📝 Docs"
              title[6] = "### 🧪 Tests"
              title[7] = "### 🔧 Chore"
              title[8] = "### 📦 Other"
              for (i = 1; i <= 8; i++)
                if (buf[i] != "") printf "%s\n%s", title[i], buf[i]
            }')"

          if [ -n "$GROUPED" ]; then
            NOTES="$GROUPED"
            if [ -n "$PREV" ]; then
              NOTES="${NOTES}"$'\n\n'"_Полный список: [${PREV}...${TAG}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}..${TAG})_"
            fi
          else
            # No commits since the previous tag (or no history at all): fall
            # back to GitHub's own notes generator.
            NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                       -F tag_name="${TAG}" \
                       -F target_commitish="${GITHUB_SHA}" --jq .body)" || NOTES=""
          fi

          cat > notes.md <<EOF
          ## Установка
          Скопируй \`RAWUI0001-${TAG}.pkg\` на USB-флешку и установи через
          **Settings → Debug Settings → Game → Package Installer** (нужен GoldHEN).

          ## Что нового
          ${NOTES:-См. коммиты: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}}

          ## Проверка целостности
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Attest build provenance
        continue-on-error: true   # never let attestation block a release
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.pkg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          # gh release create makes the tag itself if it doesn't exist yet
          # (manual runs create a fresh tag at the current commit).
          # Prerelease tags (v1.2.3-rc1, v1.2.3-beta.2) are flagged so they
          # don't show up as the "latest" release on the repo page.
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$GITHUB_SHA" \
            --title "RAW UI ${{ needs.meta.outputs.title }}" \
            --notes-file notes.md \
            "${FLAGS[@]}" \
            "dist/RAWUI0001-${TAG}.pkg" \
            dist/SHA256SUMS.txt

      - name: Sync Pages fallback package
        continue-on-error: true   # a failed push must not undo the release
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          # docs/RAWUI0001.pkg is the static-package fallback served by Pages;
          # *.pkg is gitignored, so add with -f (the file is already tracked).
          git fetch origin main
          git checkout -B main origin/main
          cp "dist/RAWUI0001-${TAG}.pkg" docs/RAWUI0001.pkg
          git add -f docs/RAWUI0001.pkg
          if git diff --cached --quiet; then
            echo "docs/RAWUI0001.pkg is already up to date, skipping"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: sync docs/RAWUI0001.pkg from release ${TAG}"
          git push origin main
