name: pr-title

# The release changelog is generated from commit subjects, and PR titles are
# what squash-merges turn into commit subjects, so a bad PR title silently
# produces a bad changelog entry.  This keeps the format honest.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Conventional title
    runs-on: ubuntu-24.04
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Matches the grouping in .github/workflows/release.yml.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            build
            ci
            style
          requireScope: false
