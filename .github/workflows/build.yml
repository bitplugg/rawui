name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version written into param.sfo (MAJOR.MINOR)
        type: string
        required: false
        default: '1.00'

env:
  OO_VERSION: v0.5.4
  OO_ASSET: toolchain-llvm-18.tar.gz

jobs:
  pkg:
    name: Build FPKG
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 make curl ca-certificates file
          sudo ln -sf /usr/bin/clang-18   /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18  /usr/local/bin/ld.lld

      - name: Cache OpenOrbis toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: ~/oo/OpenOrbis
          key: oo-${{ env.OO_VERSION }}-${{ env.OO_ASSET }}

      - name: Fetch OpenOrbis toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/oo/dl
          curl -fsSL --retry 3 -o ~/oo/dl/${OO_ASSET} \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${OO_VERSION}/${OO_ASSET}"
          tar -xzf ~/oo/dl/${OO_ASSET} -C ~/oo/dl
          mkdir -p ~/oo/OpenOrbis
          mv ~/oo/dl/OpenOrbis/PS4Toolchain ~/oo/OpenOrbis/PS4Toolchain

      - name: Fetch OpenSSL 1.1 runtime (for PkgTool.Core)
        run: |
          mkdir -p ~/ssl11
          curl -fsSL --retry 3 -o /tmp/libssl1.1.deb \
            "http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb"
          # sha256 pin: refuse to install a tampered package
          echo "7cf39d70a639017d1dd7c8d36daa2258063608688e449fddf40ffdd46f992a78  /tmp/libssl1.1.deb" \
            | sha256sum -c -
          dpkg-deb -x /tmp/libssl1.1.deb ~/ssl11

      - name: Show build metadata
        env:
          OO_PS4_TOOLCHAIN: /home/runner/oo/OpenOrbis/PS4Toolchain
        # `make info` only echoes metadata (title, ids, source counts); it
        # does not compile anything, so it is a safe sanity check.
        run: make info

      - name: Compile package
        env:
          OO_PS4_TOOLCHAIN: /home/runner/oo/OpenOrbis/PS4Toolchain
          LD_LIBRARY_PATH: /home/runner/ssl11/usr/lib/x86_64-linux-gnu
        # build.sh forwards extra args to make; command-line vars override
        # the Makefile's := defaults, so VERSION comes from the release tag.
        run: bash tools/build.sh VERSION="${{ inputs.version || '1.00' }}"

      - name: Show artefacts
        run: ls -lh dist/

      - name: Validate package
        run: |
          PKG="$(ls dist/*.pkg)"
          # PS4 packages start with the magic 7F 43 4E 54 ("\x7FCNT")
          MAGIC="$(head -c 4 "$PKG" | od -An -tx1 | tr -d ' \n')"
          if [ "$MAGIC" != "7f434e54" ]; then
            echo "::error::bad package magic: $MAGIC (expected 7f434e54)"
            exit 1
          fi
          SIZE="$(stat -c%s "$PKG")"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::package suspiciously small: $SIZE bytes"
            exit 1
          fi
          echo "OK: $PKG ($SIZE bytes)"

      - name: Upload .pkg
        uses: actions/upload-artifact@v4
        with:
          name: RAWUI0001-pkg
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 30
