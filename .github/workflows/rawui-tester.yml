name: rawui-tester

# RAW UI's own sanity bot.  The generic CI (build.yml) proves the code
# compiles and the package opens; this workflow proves the package is *the
# right package*.  It exists because the failure modes that actually reached
# hardware - CE-32957-6 from a malformed TITLE_ID/CONTENT_ID, a stale
# docs/RAWUI0001.pkg on Pages, the JS colour engine drifting from the C++ one -
# all pass a normal build.
#
# It builds the FPKG itself (the gp4 manifest and the package are build
# products, so the payload checks need a real artefact) and then runs
# tools/rawui-tester.sh, which is also runnable locally exactly as-is.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  OO_VERSION: v0.5.4
  OO_ASSET: toolchain-llvm-18.tar.gz

permissions:
  contents: read

jobs:
  sanity:
    name: Package sanity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # g++/make for the host tests, node for the JS colour-engine port check,
      # file for package inspection.
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 make nodejs file python3 curl ca-certificates
          sudo ln -sf /usr/bin/clang-18   /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18  /usr/local/bin/ld.lld

      - name: Cache OpenOrbis toolchain
        id: cache-tc
        uses: actions/cache@v6
        with:
          path: ~/oo/OpenOrbis
          key: oo-${{ env.OO_VERSION }}-${{ env.OO_ASSET }}

      - name: Fetch OpenOrbis toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/oo/dl
          curl -fsSL --retry 3 -o ~/oo/dl/${OO_ASSET} \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${OO_VERSION}/${OO_ASSET}"
          tar -xzf ~/oo/dl/${OO_ASSET} -C ~/oo/dl
          mkdir -p ~/oo/OpenOrbis
          mv ~/oo/dl/OpenOrbis/PS4Toolchain ~/oo/OpenOrbis/PS4Toolchain

      - name: Fetch OpenSSL 1.1 runtime (for PkgTool.Core)
        run: |
          mkdir -p ~/ssl11
          curl -fsSL --retry 3 -o /tmp/libssl1.1.deb \
            "http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb"
          echo "7cf39d70a639017d1dd7c8d36daa2258063608688e449fddf40ffdd46f992a78  /tmp/libssl1.1.deb" \
            | sha256sum -c -
          dpkg-deb -x /tmp/libssl1.1.deb ~/ssl11

      - name: Build FPKG
        env:
          OO_PS4_TOOLCHAIN: /home/runner/oo/OpenOrbis/PS4Toolchain
          LD_LIBRARY_PATH: /home/runner/ssl11/usr/lib/x86_64-linux-gnu
        run: bash tools/build.sh

      - name: Run rawui-tester
        run: tools/rawui-tester.sh
