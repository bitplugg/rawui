# Path-based labels applied by .github/workflows/labeler.yml (actions/labeler
# v7 format: each label maps to a list of file-match conditions).
#
# The labels themselves are created in .github/labels.yml and applied with
# `tools/sync-labels.sh`.

app:
  - changed-files:
      - any-glob-to-any-file: 'src/**'

site:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

build:
  - changed-files:
      - any-glob-to-any-file: 'Makefile'
      - any-glob-to-any-file: 'tools/**'

tests:
  - changed-files:
      - any-glob-to-any-file: 'tests/**'

documentation:
  - changed-files:
      - any-glob-to-any-file: '*.md'
      - any-glob-to-any-file: 'docs/**/*.html'
